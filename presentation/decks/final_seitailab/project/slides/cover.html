<h1>行動認識モデル</h1>
<p class="team">生体情報処理研究室</p>
<aside>生体情報処理研究室です。腰に付けたスマホの加速度とジャイロから、歩行・上り・下り・座位・立位・臥位の6つを見分けます。目指したのは、別の人や端末の付け方が変わっても崩れないモデルです。審査用データは別の人の記録なので、学習データの人を覚えるのではなく、どの人にも共通する体の動きを特徴量にしました。特徴量は32列、モデルはガウスSVM 1つです。</aside>
