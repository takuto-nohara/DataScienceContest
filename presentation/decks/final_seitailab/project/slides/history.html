<h2><span class="no">3　</span>特徴量の試行錯誤</h2>
<p class="lead">列を足すたびに正解率が上がり、<span class="hl">91.9% → 98.6%</span></p>
<p class="brand">生体情報処理研究室</p>
<img src="/_blob/e7edb0bf7811d8de8a399a78c0b760ba" alt="段階ごとに正解率が上がる階段グラフと、各段階で足した列の考え方の図" style="width: 1696px; height: 716px; flex-shrink: 0;">
<p class="gx foot"><span class="lbl">正解率　</span>学習データ2941試行を、記録単位の5分割で予測した値</p>
<p class="pageno">4</p>
<aside>主催者の12列は平均と標準偏差だけなので、1歩ごとの着地や周期が消え、歩行と階段を141試行取り違えました。着地の衝撃と周期の列を足すと、13試行に減りました。次に残ったのは座位と立位です。骨盤のねじれは立位が座位の3倍ありますが、歩行と同じ目盛りでは差が見えないので、対数にしました。続いて、隣の点との差で細かいねじれを拾い、最後に骨盤が回る支点までの距離を足して、98.6%になりました。</aside>
